name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release VSIX
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a valid semantic version prefixed with v (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Check project
        run: pnpm check:all

      - name: Package extension
        run: pnpm package:extension

      - name: Generate checksums
        env:
          VSIX_FILE: dist/xmark-preview-${{ steps.version.outputs.version }}.vsix
        run: sha256sum "$VSIX_FILE" > dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG_NAME" "dist/xmark-preview-$VERSION.vsix" dist/checksums.txt --verify-tag --generate-notes --title "$TAG_NAME"
