name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release VSIX
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! node -e 'const semver = require("semver"); const version = semver.valid(process.argv[1]); if (version !== process.argv[1] || semver.prerelease(version)) process.exit(1);' "$VERSION"; then
            echo "Stable release tags must use a stable semantic version prefixed with v (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Check project
        run: pnpm check:all

      - name: Package extension
        run: pnpm package:extension

      - name: Generate checksums
        env:
          VSIX_FILE: dist/xmark-preview-${{ steps.version.outputs.version }}.vsix
        run: sha256sum "$VSIX_FILE" > dist/checksums.txt

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VSIX_FILE: dist/xmark-preview-${{ steps.version.outputs.version }}.vsix
          MINIMUM_SUPPORTED_VERSION: ${{ vars.XMARK_MINIMUM_SUPPORTED_VERSION || '0.0.0' }}
        run: |
          if ! node -e 'const semver = require("semver"); if (semver.valid(process.argv[1]) !== process.argv[1]) process.exit(1);' "$MINIMUM_SUPPORTED_VERSION"; then
            echo "XMARK_MINIMUM_SUPPORTED_VERSION must be a valid semantic version." >&2
            exit 1
          fi
          SHA256="$(sha256sum "$VSIX_FILE" | awk '{print $1}')"
          mkdir -p pages/update
          jq -n \
            --arg version "$VERSION" \
            --arg minimumSupportedVersion "$MINIMUM_SUPPORTED_VERSION" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha256 "$SHA256" \
            '{schemaVersion: 1, channel: "stable", latestVersion: $version, minimumSupportedVersion: $minimumSupportedVersion, publishedAt: $publishedAt, releaseNotes: ("https://github.com/hyxf/xmarkdown-preview/releases/tag/v" + $version), download: {url: ("https://github.com/hyxf/xmarkdown-preview/releases/download/v" + $version + "/xmark-preview-" + $version + ".vsix"), fileName: ("xmark-preview-" + $version + ".vsix"), sha256: $sha256}, compatibility: {vscode: ">=1.106.0"}}' \
            > pages/update/stable.json

      - name: Upload update metadata
        uses: actions/upload-artifact@v5
        with:
          name: update-pages
          path: pages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG_NAME" "dist/xmark-preview-$VERSION.vsix" dist/checksums.txt --verify-tag --generate-notes --title "$TAG_NAME"
